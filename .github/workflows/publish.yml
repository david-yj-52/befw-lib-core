name: Publish befw-lib-core to GitHub Packages

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-befw</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-schema</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-lib-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Deploy befw-lib-core
        run: mvn -B deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # Repository Settings > Secrets and variables > Actions 에 read:packages + write:packages
          # 스코프를 가진 classic PAT을 PACKAGES_TOKEN 이름으로 등록해야 합니다.
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
